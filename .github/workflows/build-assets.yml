name: Build visual assets
on:
  push:
    paths: ['scripts/**', 'assets/source/avatar.b64', '.github/workflows/**']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: profile-assets
  cancel-in-progress: false
jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: scripts/requirements.txt
      - run: pip install -r scripts/requirements.txt
      - run: python scripts/generate_banner.py
      - run: python scripts/generate_cards.py
      - run: python scripts/verify.py
      - name: Commit rendered assets
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add assets
          if ! git diff --cached --quiet; then
            git commit -m "Render image-driven CYBERWIND assets"
            git push
          fi
